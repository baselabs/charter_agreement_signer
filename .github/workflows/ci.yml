name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate battery (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # The ML-DSA-65 mint path needs a linked OpenSSL >= 3.5 (FIPS 204 landed
    # there). bob's OTP builds dynamically link the distro libcrypto.so.3
    # with nothing bundled, and ubuntu-24.04 ships OpenSSL 3.0.x, which
    # cannot generate or verify ML-DSA keys (EVP "Bad key type"). ubuntu-26.04
    # ships OpenSSL 3.5.x; setup-beam resolves the matching bob build per
    # distro, so every matrix lane keeps its pinned versions.
    runs-on: ubuntu-26.04

    # `mix ci` runs this battery on the local toolchain, plus the example
    # and TypeScript source checks. The matrix is CI-side breadth
    # across supported Elixir/OTP pairs; every cell runs the identical
    # battery. LOCKSTEP: the lanes stay inside the supported range declared
    # in code — mix.exs's Elixir range + config/config.exs's supported-OTP
    # set — and any lane change lands in ONE commit with those two and
    # .tool-versions (divergence is a defect).
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5.0.3"
          - elixir: "1.20.2"
            otp: "28.5.0.3"
          - elixir: "1.20.3"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # dialyzer's PLTs (_build/plts, mix.exs): rebuilt from scratch on every run without this.
      - name: Cache dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test and export standard coverage
        run: mix test --cover --export-coverage standard-${{ matrix.elixir }}-${{ matrix.otp }}

      - name: Save standard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-standard-${{ matrix.elixir }}-${{ matrix.otp }}
          path: cover/*.coverdata
          if-no-files-found: error

      # These library checks also run in mix ci:

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start scripts/check_deps_current.exs

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    name: examples/charter_lifecycle (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Substrate parity with the gate battery: the example itself mints
    # Ed25519 at revision 2 today, but it shares the gate's matrix lanes and
    # the lock-parity surface, and ubuntu-latest floats (24.04 / OpenSSL
    # 3.0.x today) while the library's ML-DSA-65 mint path needs the distro
    # OpenSSL >= 3.5 that ubuntu-26.04 provides.
    runs-on: ubuntu-26.04

    # Same three-cell matrix as the gate job: the example app is part of the
    # supported surface (its lock parity with the library must hold on every
    # lane). LOCKSTEP: lanes stay inside the range declared in code (its own
    # mix.exs + config/config.exs supported-OTP set).
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5.0.3"
          - elixir: "1.20.2"
            otp: "28.5.0.3"
          - elixir: "1.20.3"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: examples/charter_lifecycle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start ../../scripts/check_deps_current.exs

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the bilateral round-trip + the counterparty isolation + lock parity)
        run: mix test
  typescript:
    name: Pinned TypeScript signer suite
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.8"

      - name: Install dependencies
        run: mix deps.get

      - name: Materialize pinned public sources
        run: mix typescript.sources

      - name: Build pinned sources and run the signer suite
        run: mix typescript.check

  capability-limited:
    name: Capability-limited substrate
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "28.5.0.3"

      - name: Install dependencies
        run: mix deps.get

      - name: Assert ML-DSA is unverifiable on this lane
        run: mix run --no-start scripts/assert_limited_substrate.exs

      - name: Test and export limited coverage
        run: mix test --exclude requires_mldsa_substrate --cover --export-coverage limited

      - name: Save limited coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-limited
          path: cover/*.coverdata
          if-no-files-found: error

  coverage:
    name: Merged coverage floor
    needs: [gate, capability-limited]
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"

      - name: Compile for the merged report
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Load both lanes' coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: cover

      - name: Require every lane and gate merged coverage
        run: |
          test -f cover/standard-1.19.5-28.5.0.3.coverdata
          test -f cover/standard-1.20.2-28.5.0.3.coverdata
          test -f cover/standard-1.20.3-29.0.3.coverdata
          test -f cover/limited.coverdata
          mix test.coverage
