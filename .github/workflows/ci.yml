name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate battery (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # The ML-DSA-65 mint path needs a linked OpenSSL >= 3.5 (FIPS 204 landed
    # there). bob's OTP builds dynamically link the distro libcrypto.so.3
    # with nothing bundled, and ubuntu-24.04 ships OpenSSL 3.0.x, which
    # cannot generate or verify ML-DSA keys (EVP "Bad key type"). ubuntu-26.04
    # ships OpenSSL 3.5.x; setup-beam resolves the matching bob build per
    # distro, so both matrix lanes keep their pinned versions.
    runs-on: ubuntu-26.04

    # Local parity: `mix ci` reproduces these steps step-for-step on the
    # DEV lane only (asdf .tool-versions). The matrix is CI-side breadth
    # across supported Elixir/OTP pairs; every cell runs the identical
    # battery. LOCKSTEP: the lanes stay inside the supported range declared
    # in code — mix.exs's Elixir range + config/config.exs's supported-OTP
    # set — and any lane change lands in ONE commit with those two and
    # .tool-versions (divergence is a defect).
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5.0.3"
          - elixir: "1.20.2"
            otp: "28.5.0.3"
          - elixir: "1.20.3"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the wrong-key gate and the refusal battery)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start scripts/check_deps_current.exs

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    name: examples/charter_lifecycle (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Substrate parity with the gate battery: the example itself mints
    # Ed25519 at revision 2 today, but it shares the gate's matrix lanes and
    # the lock-parity surface, and ubuntu-latest floats (24.04 / OpenSSL
    # 3.0.x today) while the library's ML-DSA-65 mint path needs the distro
    # OpenSSL >= 3.5 that ubuntu-26.04 provides.
    runs-on: ubuntu-26.04

    # Same two-cell matrix as the gate job: the example app is part of the
    # supported surface (its lock parity with the library must hold on every
    # lane). LOCKSTEP: lanes stay inside the range declared in code (its own
    # mix.exs + config/config.exs supported-OTP set).
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5.0.3"
          - elixir: "1.20.2"
            otp: "28.5.0.3"
          - elixir: "1.20.3"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: examples/charter_lifecycle

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start ../../scripts/check_deps_current.exs

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the bilateral round-trip + the counterparty isolation + lock parity)
        run: mix test

  # The Windows proof: a plain clone must be workable on a Windows machine.
  # Runs the portable developer surface on windows-latest — deps, format,
  # compile (own code fatal, deps under their own posture), credo, tests
  # (minus the ML-DSA mint, whose substrate needs an OpenSSL >= 3.5 link the
  # Windows OTP build may not carry — the same exclusion class as Ubuntu
  # 24.04's OpenSSL 3.0.x), audits, the currency gate, and the shipped-
  # artifact package census with its consumer smoke (the ported scripts:
  # OS-aware mix spawn, no mktemp). NOT claimed on Windows: dialyzer (the
  # from-scratch Windows PLT build is slow and adds no portability signal),
  # docs, and the reproducibility gate (its value is regression detection
  # on the release substrate).
  windows:
    name: Windows clone pickup (${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.3"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile (warnings as errors, own code only)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (excluding the ML-DSA mint substrate)
        run: mix test --exclude requires_mldsa_substrate

      # No coverage step on this lane BY DESIGN: the excluded ML-DSA mint
      # test carries covered lines, so the total lands under the 100.0 floor
      # by construction (97.59% observed). The floor is the Linux lanes'
      # gate; this lane proves clone pickup, not coverage.

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start scripts/check_deps_current.exs

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs
