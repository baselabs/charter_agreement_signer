name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 45120134966: slowest green 7s; under 2.5 minutes, so the 5-minute floor.
    outputs:
      beam_matrix: ${{ steps.matrix.outputs.beam_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared reader
        run: scripts/toolchain.sh --self-test
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"
      - name: Compose the qualification matrix
        id: matrix
        env:
          ELIXIR: ${{ steps.versions.outputs.elixir }}
          OTP: ${{ steps.versions.outputs.otp }}
          BEAM_LANES: ${{ steps.versions.outputs.beam_lanes }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          lanes = [{"elixir": os.environ["ELIXIR"], "otp": os.environ["OTP"]}, *json.loads(os.environ["BEAM_LANES"])]
          for lane in lanes:
              lane["elixir_release"] = lane["elixir"].split("-otp-", 1)[0]
          print("beam_matrix=" + json.dumps({"include": list(reversed(lanes))}, separators=(",", ":")))
          PYTHON

  workflow-syntax:
    timeout-minutes: 5 # Run 45295895166: slowest green 28s; under 2.5 minutes, so the 5-minute floor.
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go runtime drift
        env:
          EXPECTED_GO: ${{ steps.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed "golang=$EXPECTED_GO"

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    timeout-minutes: 5 # Run 45295895166: slowest green 34s; under 2.5 minutes, so the 5-minute floor.
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      # A shallow checkout omits commits that the secret scan must inspect.
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go runtime drift
        env:
          EXPECTED_GO: ${{ steps.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed "golang=$EXPECTED_GO"

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  gate:
    needs: toolchain
    timeout-minutes: 8 # run 44110191336: slowest green 234s; twice rounded up
    name: Gate battery (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # The ML-DSA-65 mint path needs a linked OpenSSL >= 3.5 (FIPS 204 landed
    # there). bob's OTP builds dynamically link the distro libcrypto.so.3
    # with nothing bundled, and ubuntu-24.04 ships OpenSSL 3.0.x, which
    # cannot generate or verify ML-DSA keys (EVP "Bad key type"). ubuntu-26.04
    # ships OpenSSL 3.5.x; setup-beam resolves the matching bob build per
    # distro, so every matrix lane keeps its pinned versions.
    runs-on: ubuntu-26.04

    # `mix ci` runs this battery on the local toolchain, plus the example
    # and TypeScript source checks. The matrix is CI-side breadth
    # across supported Elixir/OTP pairs; every cell runs the identical
    # battery. LOCKSTEP: the lanes stay inside the supported range declared
    # in code — mix.exs's Elixir range + config/config.exs's supported-OTP
    # set — and any lane change lands in ONE commit with those two and
    # .tool-versions (divergence is a defect).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ matrix.elixir }}
          EXPECTED_OTP: ${{ matrix.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      # dialyzer's PLTs (_build/plts, mix.exs). Qualification only restores:
      # cache-warmer.yml saves them from the default branch, the one ref whose
      # caches every kci/ ref can read.
      - name: Restore dialyzer PLTs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir_release }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir_release }}-

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test and export standard coverage
        run: mix test --cover --export-coverage standard-${{ matrix.elixir_release }}-${{ matrix.otp }}

      - name: Save standard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-standard-${{ matrix.elixir_release }}-${{ matrix.otp }}
          path: cover/*.coverdata
          if-no-files-found: error
          retention-days: 1

      # These library checks also run in mix ci:

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start scripts/check_deps_current.exs

      - name: Exercise signing from the packaged archive
        run: mix run --no-start scripts/check_packaged_signing.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    needs: toolchain
    timeout-minutes: 5 # Run 44110191336: slowest green 32s; under 2.5 minutes, so the 5-minute floor.
    name: examples/charter_lifecycle (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Substrate parity with the gate battery: the example itself mints
    # Ed25519 at revision 2 today, but it shares the gate's matrix lanes and
    # the lock-parity surface, and ubuntu-latest floats (24.04 / OpenSSL
    # 3.0.x today) while the library's ML-DSA-65 mint path needs the distro
    # OpenSSL >= 3.5 that ubuntu-26.04 provides.
    runs-on: ubuntu-26.04

    # Same three-cell matrix as the gate job: the example app is part of the
    # supported surface (its lock parity with the library must hold on every
    # lane). LOCKSTEP: lanes stay inside the range declared in code (its own
    # mix.exs + config/config.exs supported-OTP set).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    env:
      MIX_ENV: test

    defaults:
      run:
        shell: bash
        working-directory: examples/charter_lifecycle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        working-directory: ${{ github.workspace }}
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_ELIXIR: ${{ matrix.elixir }}
          EXPECTED_OTP: ${{ matrix.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Check dependency currency (no resolvable drift)
        run: mix run --no-start ../../scripts/check_deps_current.exs

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors, own code only)
        # Dependencies compile under their own warning posture first — a
        # transitive dep warning under an older supported Elixir (protobuf's
        # struct-update warning on 1.19) is not ours to fatalize; our code
        # stays under --warnings-as-errors on every lane.
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the bilateral round-trip + the counterparty isolation + lock parity)
        run: mix test
  typescript:
    timeout-minutes: 5 # Run 44122629465: slowest green 94s; under 2.5 minutes, so the 5-minute floor.
    name: Pinned TypeScript signer suite
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Materialize pinned public sources
        run: mix typescript.sources

      - name: Build pinned sources and run the signer suite
        run: mix typescript.check

  capability-limited:
    timeout-minutes: 5 # Run 44122629465: slowest green 100s; under 2.5 minutes, so the 5-minute floor.
    name: Capability-limited substrate
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh ci/capability-limited/.tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Assert ML-DSA is unverifiable on this lane
        run: mix run --no-start scripts/assert_limited_substrate.exs

      - name: Test and export limited coverage
        run: mix test --exclude requires_mldsa_substrate --cover --export-coverage limited

      - name: Save limited coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-limited
          path: cover/*.coverdata
          if-no-files-found: error
          retention-days: 1

  coverage:
    timeout-minutes: 5 # Run 42534000288: slowest green 62s; under 2.5 minutes, so the 5-minute floor.
    name: Merged coverage floor
    needs: [toolchain, gate, capability-limited]
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Compile for the merged report
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors

      - name: Load both lanes' coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: cover

      - name: Require every lane and gate merged coverage
        env:
          BEAM_MATRIX: ${{ needs.toolchain.outputs.beam_matrix }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          for lane in json.loads(os.environ["BEAM_MATRIX"])["include"]:
              path = Path(f"cover/standard-{lane['elixir_release']}-{lane['otp']}.coverdata")
              if not path.is_file():
                  raise SystemExit(f"missing coverage: {path}")
          PYTHON
          test -f cover/limited.coverdata
          mix test.coverage

  hex-qualification:
    name: Qualify Hex archives
    runs-on: ubuntu-26.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          install-hex: false
      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: qualify
          package: charter_agreement_signer
          package-directory: .

  qualified:
    timeout-minutes: 5 # Run 44198062651: slowest green 2s; under 2.5 minutes, so the 5-minute floor.
    if: always()
    needs: [toolchain, workflow-syntax, secret-scan, gate, example, typescript, capability-limited, coverage, hex-qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
