name: Publish

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Qualified release commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      qualification_run:
        description: Original CI run ID when retrying publication
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.upload.outputs.qualification-run }}
      qualification-sha256: ${{ steps.upload.outputs.qualification-sha256 }}
      version: ${{ steps.upload.outputs.version }}
    steps:
      - name: Validate the dispatch inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read locked BEAM versions as data
        id: toolchain
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import re, sys
          versions = {}
          for line in sys.stdin:
              tool, *values = line.split("#", 1)[0].split() or [""]
              if tool in ("elixir", "erlang"):
                  if tool in versions or not values:
                      sys.exit("Invalid locked BEAM version rows")
                  versions[tool] = values[0]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+", versions.get("elixir", "")):
              sys.exit("Invalid locked Elixir version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?", versions.get("erlang", "")):
              sys.exit("Invalid locked Erlang version")
          if versions["elixir"].rsplit("-", 1)[1] != versions["erlang"].split(".", 1)[0]:
              sys.exit("Locked BEAM versions disagree")
          print("elixir=" + versions["elixir"])
          print("otp=" + versions["erlang"])
          ' >> "$GITHUB_OUTPUT"
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          install-hex: false
          install-rebar: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Upload qualified Hex archives
        id: upload
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: upload
          package: charter_agreement_signer
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ inputs.qualification_run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: upload
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      MIX_ENV: dev
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VERSION: ${{ needs.upload.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read locked BEAM versions as data
        id: toolchain
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import re, sys
          versions = {}
          for line in sys.stdin:
              tool, *values = line.split("#", 1)[0].split() or [""]
              if tool in ("elixir", "erlang"):
                  if tool in versions or not values:
                      sys.exit("Invalid locked BEAM version rows")
                  versions[tool] = values[0]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+", versions.get("elixir", "")):
              sys.exit("Invalid locked Elixir version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?", versions.get("erlang", "")):
              sys.exit("Invalid locked Erlang version")
          if versions["elixir"].rsplit("-", 1)[1] != versions["erlang"].split(".", 1)[0]:
              sys.exit("Locked BEAM versions disagree")
          print("elixir=" + versions["elixir"])
          print("otp=" + versions["erlang"])
          ' >> "$GITHUB_OUTPUT"
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          install-hex: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Verify served Hex archives
        id: served
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: read-back
          package: charter_agreement_signer
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ github.workspace }}/release-assets
      - name: Verify the checked-out source for additional release assets
        env:
          PUBLISHED_COMMIT: ${{ steps.served.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$PUBLISHED_COMMIT"

      - name: Install locked SBOM dependencies
        run: mix deps.get --check-locked

      - name: Generate CycloneDX SBOM
        # mix.exs and mix.lock come from the release commit; the generator
        # command comes from this workflow's commit.
        run: |
          script="$RUNNER_TEMP/build_release_sbom.sh"
          git show "$GITHUB_WORKFLOW_SHA:scripts/build_release_sbom.sh" > "$script"
          bash "$script"
          rm -f -- "$script"

      - name: Record the SBOM checksum
        working-directory: release-assets
        run: sha256sum -- release.cdx.json >> SHA256SUMS

      - name: Attest the release source commit
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/charter_agreement_signer-${{ env.VERSION }}.tar
          predicate-type: https://github.com/baselabs/charter_agreement_signer/blob/master/docs/release.md#release-source-attestation
          predicate: '{"release_commit":"${{ steps.served.outputs.commit }}"}'

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/charter_agreement_signer-*.tar
          sbom-path: release-assets/release.cdx.json

      - name: Verify the signed release source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_COMMIT: ${{ steps.served.outputs.commit }}
        run: |
          archive="$GITHUB_WORKSPACE/release-assets/charter_agreement_signer-${VERSION}.tar"
          signer="$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          predicate="https://github.com/baselabs/charter_agreement_signer/blob/master/docs/release.md#release-source-attestation"
          digest=$(sha256sum < "$archive")
          bundle="$RUNNER_TEMP/sha256:${digest%% *}.jsonl"
          trap 'rm -f -- "$bundle"' EXIT
          (cd "$RUNNER_TEMP" && gh attestation download "$archive" --repo "$GITHUB_REPOSITORY")
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --bundle "$bundle" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" --predicate-type "$predicate" --format json |
            jq -e --arg commit "$PUBLISHED_COMMIT" \
              'any(.[]; .verificationResult.statement.predicate.release_commit == $commit)' >/dev/null

      - name: Upload consumer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            release-assets/charter_agreement_signer-*.tar
            release-assets/charter_agreement_signer-*-docs.tar.gz
            release-assets/SHA256SUMS
            release-assets/release.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove release assets
        if: always()
        run: rm -rf -- release-assets
