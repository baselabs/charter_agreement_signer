name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 90 # no green run yet
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      MIX_ENV: test
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      HEX_HTTP_TIMEOUT: "120"
    steps:
      - name: Refuse a nondefault ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install pinned Hex
        run: mix local.hex 2.7.0 --force

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Refuse an existing remote release tag
        run: |
          version=$(sed -n 's/^  @version "\([^"]*\)".*$/\1/p' mix.exs)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tags=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}")
          if [ -n "$tags" ]; then
            echo "::error::This release version is already tagged"
            exit 1
          fi

      - name: Build documentation
        run: mix docs --warnings-as-errors --formatter html

      - name: Record docs release provenance
        env:
          DOCS_PACKAGE: charter_agreement_signer
        run: |
          elixir -e 'File.write!("doc/release.json", JSON.encode!(%{"package" => System.fetch_env!("DOCS_PACKAGE"), "version" => System.fetch_env!("VERSION"), "commit" => System.fetch_env!("GITHUB_SHA")}))'

      - name: Build and inspect the package and consumer
        run: mix run --no-start scripts/check_package.exs

      - name: Build the two release archives
        run: |
          mkdir release-assets
          mix hex.build --output "release-assets/charter_agreement_signer-${VERSION}.tar"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C doc -cf - . | gzip -n -9 > "release-assets/charter_agreement_signer-${VERSION}-docs.tar.gz"

      - name: Generate CycloneDX SBOM
        run: bash scripts/build_release_sbom.sh

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/charter_agreement_signer-*.tar

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/charter_agreement_signer-*.tar
          sbom-path: release-assets/release.cdx.json

      - name: Prepare an anonymous registry home
        run: mkdir "$RUNNER_TEMP/hex-read"

      - name: Plan uploads from the served registry bytes
        id: plan
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/hex_release_state.exs" --plan charter_agreement_signer "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_signer-${VERSION}.tar"

      - name: Upload only the missing verified archives
        if: steps.plan.outputs.package == 'upload' || steps.plan.outputs.docs == 'upload'
        working-directory: release-assets
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          HEX_HOME: ${{ runner.temp }}/hex-upload
          PACKAGE_STATE: ${{ steps.plan.outputs.package }}
          DOCS_STATE: ${{ steps.plan.outputs.docs }}
        run: |
          flags=()
          if [ "$PACKAGE_STATE" = upload ]; then flags+=(--package); fi
          if [ "$DOCS_STATE" = upload ]; then flags+=(--docs); fi
          mix run --no-mix-exs ../scripts/hex_upload.exs "${flags[@]}" charter_agreement_signer "$VERSION" \
            "charter_agreement_signer-${VERSION}.tar" "charter_agreement_signer-${VERSION}-docs.tar.gz"

      - name: Require the served package and docs from the registry
        id: served
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/hex_release_state.exs" --served charter_agreement_signer "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_signer-${VERSION}.tar" \
            --commit "$GITHUB_SHA" --clone "$GITHUB_WORKSPACE" \
            --docs-output "$GITHUB_WORKSPACE/release-assets/charter_agreement_signer-${VERSION}-docs.tar.gz"

      # Served ancestor docs require a served package, so that case skips the keyed step.
      - name: Verify release assets belong to the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_COMMIT: ${{ steps.served.outputs.commit }}
        run: |
          gh attestation verify "release-assets/charter_agreement_signer-${VERSION}.tar" \
            --repo baselabs/charter_agreement_signer --source-digest "$PUBLISHED_COMMIT"
          if [ "$PUBLISHED_COMMIT" != "$GITHUB_SHA" ]; then
            if ! git diff --quiet "$PUBLISHED_COMMIT" "$GITHUB_SHA" -- mix.exs mix.lock scripts/build_release_sbom.sh; then
              changed=$(git diff --name-only "$PUBLISHED_COMMIT" "$GITHUB_SHA" -- mix.exs mix.lock scripts/build_release_sbom.sh | paste -sd ' ' -)
              echo "::error::SBOM inputs changed since the published commit: ${changed:-unreadable}; publication refused; the fix is a new version"
              exit 1
            fi
          fi

      - name: Record release checksums
        working-directory: release-assets
        run: sha256sum -- *.tar *.tar.gz release.cdx.json > SHA256SUMS

      - name: Upload consumer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove release archives and temporary Hex homes
        if: always()
        run: rm -rf release-assets "$RUNNER_TEMP/hex-deps" "$RUNNER_TEMP/hex-read" "$RUNNER_TEMP/hex-upload"
