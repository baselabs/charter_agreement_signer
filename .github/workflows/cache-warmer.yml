name: Cache warmer

# The one writer of the dialyzer PLT cache that qualification restores.
# A cache saved on a kci/<sha> ref is restorable only by that ref, so ci.yml
# only restores; this workflow saves from the default branch, whose caches
# every branch can restore. The lanes, runner and environment mirror ci.yml's
# gate job exactly so the key and the PLT contents match what it restores.

# A default-branch push warms a changed key. The schedule only replaces an
# evicted cache: GitHub starts this organization's schedules late and drops some.

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 45093923997: slowest green 10s; under 2.5 minutes, so the 5-minute floor.
    outputs:
      beam_matrix: ${{ steps.matrix.outputs.beam_matrix }}
    steps:
      - name: Refuse any ref but the default branch
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared reader
        run: scripts/toolchain.sh --self-test
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"
      - name: Compose the qualification matrix
        id: matrix
        env:
          ELIXIR: ${{ steps.versions.outputs.elixir }}
          OTP: ${{ steps.versions.outputs.otp }}
          BEAM_LANES: ${{ steps.versions.outputs.beam_lanes }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          lanes = [{"elixir": os.environ["ELIXIR"], "otp": os.environ["OTP"]}, *json.loads(os.environ["BEAM_LANES"])]
          for lane in lanes:
              lane["elixir_release"] = lane["elixir"].split("-otp-", 1)[0]
          print("beam_matrix=" + json.dumps({"include": list(reversed(lanes))}, separators=(",", ":")))
          PYTHON

  plt:
    needs: toolchain
    timeout-minutes: 8 # Run 44375964217: slowest green 9s, a cache hit; cold figure: the gate job that built the PLT took 3m38s in run 37479165025; doubled, rounded up. Re-measure on the first cold green run.
    name: Dialyzer PLT (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # ubuntu-26.04, as in ci.yml's gate: the PLT is restored there, and the
    # gate needs OpenSSL >= 3.5 for the ML-DSA-65 mint path.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    env:
      MIX_ENV: test

    steps:
      - name: Refuse any ref but the default branch
        run: test "$GITHUB_REF" = refs/heads/master

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Look up the PLT cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir_release }}-${{ hashFiles('mix.lock') }}
          lookup-only: true

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          install-hex: false
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          EXPECTED_ELIXIR: ${{ matrix.elixir }}
          EXPECTED_OTP: ${{ matrix.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install the Hex client pinned by the release action
        if: steps.lookup.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Restore the nearest PLT
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: ${{ steps.lookup.outputs.cache-primary-key }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir_release }}-

      - name: Install deps
        if: steps.lookup.outputs.cache-hit != 'true'
        run: mix deps.get --check-locked

      - name: Compile
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          mix deps.compile
          mix compile

      - name: Build the PLTs
        if: steps.lookup.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save the PLTs
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: ${{ steps.lookup.outputs.cache-primary-key }}
