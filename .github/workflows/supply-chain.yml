name: Supply chain

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release package evidence
    # mix ci includes the ML-DSA-65 mint test, which needs a linked
    # OpenSSL >= 3.5; ubuntu-latest is 24.04 / OpenSSL 3.0.x today (see
    # ci.yml for the full rationale).
    runs-on: ubuntu-26.04
    # The DEV lane (.tool-versions), LOCKSTEP with ci.yml's matrix lanes,
    # mix.exs's supported range, and config/config.exs's supported-OTP set —
    # ONE commit moves any change to all of them.
    env:
      ELIXIR_VERSION: "1.20.3"
      OTP_VERSION: "29.0.3"
    # Deliberately NO id-token/attestations here: this job compiles and runs
    # third-party packages' code — it must not hold OIDC identity. The
    # attest job below is the only one that can mint attestations, and it
    # runs no project code.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.8"

      - name: Build the TypeScript companion signer
        # mix ci's cross-implementation gate imports typescript/dist, which
        # is gitignored — build it before the battery runs.
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: mix deps.get

      - name: Run the full gate battery
        run: mix ci

      # Artifact names derive from mix.exs @version — never hardcoded (a stale
      # name after a version bump silently attests nothing).
      - name: Derive artifact version
        # Read @version straight from mix.exs — a `mix run` here boots :dev and
        # its compile progress would pollute the captured value.
        run: echo "VERSION=$(grep -m1 '@version "' mix.exs | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Build exact release archive
        run: |
          mkdir -p artifacts
          mix hex.build --output "artifacts/charter_agreement_signer-${VERSION}.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: sha256sum "charter_agreement_signer-${VERSION}.tar" > SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: |
          mix sbom.cyclonedx --only prod --exclude-system-dependencies \
            --classification library --schema 1.6 --format json \
            --output artifacts/release.cdx.json --force

      - name: Upload release evidence for attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            artifacts/charter_agreement_signer-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest provenance and SBOM
    needs: build
    runs-on: ubuntu-latest
    # The ONLY job with signing permissions (SLSA's build/attest split): the
    # artifact-metadata permission is on actions/attest@v4's documented
    # required set alongside id-token + attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/charter_agreement_signer-*.tar

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/charter_agreement_signer-*.tar
          sbom-path: artifacts/release.cdx.json
