name: Supply chain

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-limited:
    name: Capability-limited coverage
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "28.5.0.3"

      - name: Install dependencies from Hex
        run: mix deps.get

      - name: Assert ML-DSA is unverifiable on this lane
        run: mix run --no-start scripts/assert_limited_substrate.exs

      - name: Test and export limited coverage
        run: mix test --exclude requires_mldsa_substrate --cover --export-coverage limited

      - name: Save limited coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-coverage-limited-${{ github.sha }}
          path: cover/limited.coverdata
          if-no-files-found: error

  build:
    name: Build release package evidence
    needs: capability-limited
    # mix ci includes the ML-DSA-65 mint test, which needs a linked
    # OpenSSL >= 3.5; ubuntu-latest is 24.04 / OpenSSL 3.0.x today (see
    # ci.yml for the full rationale).
    runs-on: ubuntu-26.04
    # The DEV lane (.tool-versions), LOCKSTEP with ci.yml's matrix lanes,
    # mix.exs's supported range, and config/config.exs's supported-OTP set —
    # ONE commit moves any change to all of them. MIX_ENV: test because the
    # mix ci alias's first step refuses a :dev boot (test/support must
    # compile — the warnings trap).
    env:
      ELIXIR_VERSION: "1.20.3"
      OTP_VERSION: "29.0.3"
      MIX_ENV: test
      CAS_LIMITED_COVERAGE: ${{ github.workspace }}/limited-coverage/limited.coverdata
    # Deliberately NO id-token/attestations here: this job compiles and runs
    # third-party packages' code — it must not hold OIDC identity. The
    # attest job below is the only one that can mint attestations, and it
    # runs no project code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.8"

      - name: Install dependencies from Hex
        run: mix deps.get

      - name: Load limited coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-coverage-limited-${{ github.sha }}
          path: limited-coverage

      - name: Run the full gate battery
        run: mix ci

      # Artifact names derive from mix.exs @version — never hardcoded (a stale
      # name after a version bump silently attests nothing).
      - name: Derive artifact version
        # Read @version straight from mix.exs — a `mix run` here boots :dev and
        # its compile progress would pollute the captured value.
        run: echo "VERSION=$(grep -m1 '@version "' mix.exs | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Build exact release archive
        run: |
          mkdir -p artifacts
          mix hex.build --output "artifacts/charter_agreement_signer-${VERSION}.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: sha256sum "charter_agreement_signer-${VERSION}.tar" > SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: |
          mix sbom.cyclonedx --only prod --exclude-system-dependencies \
            --classification library --schema 1.6 --format json \
            --output artifacts/release.cdx.json --force

      - name: Upload release evidence for attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            artifacts/charter_agreement_signer-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest provenance and SBOM
    needs: build
    runs-on: ubuntu-latest
    # The ONLY job with signing permissions (SLSA's build/attest split): the
    # artifact-metadata permission is on actions/attest@v4's documented
    # required set alongside id-token + attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/charter_agreement_signer-*.tar

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/charter_agreement_signer-*.tar
          sbom-path: artifacts/release.cdx.json
